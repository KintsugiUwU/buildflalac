[project]
name = "flalac"
version = "0.2.0"
description = "Keep a lossless mirror of a music library in another format (FLAC ⇄ ALAC), with lyrics."
authors = [
    { name = "Davide Petris", email = "kintsugiuwu@noreply.codeberg.org" }
]
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "mutagen==1.47.0",
    "python-multipart>=0.0.33",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
    "watchdog>=7.0.0",
]

[project.scripts]
flalac = "flalac.__main__:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
