# Codeberg (Forgejo Actions): lint and tests on every push. Codeberg's hosted runners are
# small and short-lived, so images are built with scripts/release.sh on a Podman host.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: codeberg-small
    container:
      image: docker.io/library/python:3.12-slim
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg git nodejs
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: pip install uv==0.13.6
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q
