# Experiment: how far is the Swift app from building for Intel and older macOS?
# Compiles only (no engine), keeps going on errors and reports them as annotations.
name: Compatibility test

on:
  push:
    branches: [compat-test]

jobs:
  swift:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-macos11.0, x86_64-apple-macos10.15, x86_64-apple-macos10.13]
    steps:
      - uses: actions/checkout@v5
      - name: Compiler
        run: swiftc --version
      - name: Compile for ${{ matrix.target }}
        run: |
          set -o pipefail
          swiftc -target "${{ matrix.target }}" -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            -swift-version 6 -parse-as-library -typecheck macos/Sources/*.swift 2>&1 | tee build.log
      - name: Report errors as annotations
        if: failure()
        run: |
          # GitHub shows at most 10 annotations per step: one summary per file, then a total
          grep -E ':[0-9]+:[0-9]+: error:' build.log | sed -E 's#^'"$PWD"'/##' | sort -u > errors.txt || true
          cut -d: -f1 errors.txt | sort | uniq -c | sort -rn | head -8 | while read -r n file; do
            first=$(grep -m1 "^$file:" errors.txt | sed -E 's/^[^:]+:[0-9]+:[0-9]+: error: //')
            echo "::error file=$file::$n errors, e.g. $first"
          done
          kinds=$(sed -E 's/.*error: //; s/.(macOS [0-9.]+ or newer).*/\1/' errors.txt | sed -E "s/'[^']*'/X/g" | sort | uniq -c | sort -rn | head -6 | tr '\n' ';')
          echo "::error::total $(wc -l < errors.txt) errors in $(cut -d: -f1 errors.txt | sort -u | wc -l) files | $kinds"
